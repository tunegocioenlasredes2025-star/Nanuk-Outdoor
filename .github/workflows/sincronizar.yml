name: Sincronizar con Empretienda

# Todos los días a las 6 de la mañana (hora argentina) y cuando se quiera, desde la pestaña Actions.
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Leer precios, stock y talles de Empretienda
        run: node scripts/sincronizar.js
      - name: Publicar si algo cambió
        run: |
          if git diff --quiet data/productos.json; then
            echo "Sin cambios"
          else
            git config user.name "Sincronizador Nanuk"
            git config user.email "actions@users.noreply.github.com"
            git add data/productos.json
            git commit -m "Precios y stock actualizados desde Empretienda"
            git push
          fi
